<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specifications Viewer</title>
    <!-- Standalone Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Universal Marked.js Markdown Parser Compiler -->
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script>
        // Safely configure Tailwind custom design tokens once script is fully available
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        claude: {
                            bg: '#fbfaf7', /* Warm Anthropic ivory */
                            dark: '#191919', /* Deep ink black */
                            muted: '#666666', /* Medium reading gray */
                            border: '#e6e4de', /* Subtle clay dividing line */
                            accent: '#cc6633' /* Strategic architectural pop */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['Courier New', 'Courier', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fbfaf7;
            color: #191919;
        }
        
        /* Style markdown tables clean and minimal */
        .markdown-body table {
            width: 100%;
            margin-bottom: 2rem;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }
        .markdown-body th {
            padding: 0.75rem;
            border-bottom: 2px solid #e6e4de;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #666666;
            text-transform: uppercase;
        }
        .markdown-body td {
            padding: 0.75rem;
            border-bottom: 1px solid #e6e4de;
            font-weight: 300;
        }
        .markdown-body h1 {
            font-size: 2.25rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            letter-spacing: -0.025em;
            color: #191919;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e6e4de;
            padding-bottom: 0.5rem;
        }
        .markdown-body h3 {
            font-size: 1.125rem;
            font-weight: 500;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .markdown-body p {
            margin-bottom: 1.25rem;
            font-weight: 300;
            line-height: 1.75;
            color: #333333;
        }
        .markdown-body code {
            font-family: 'Courier New', monospace;
            background: #e6e4de;
            padding: 0.2rem 0.4rem;
            font-size: 0.85rem;
            border-radius: 3px;
        }
        .markdown-body pre {
            background: #191919;
            color: #fbfaf7;
            padding: 1.5rem;
            overflow-x: auto;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }
        .markdown-body ul {
            list-style-type: square;
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 300;
        }
        .markdown-body li {
            margin-bottom: 0.5rem;
        }

        /* --- UPDATED: High Contrast Links --- */
        .markdown-body a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.15s ease;
        }
        .markdown-body a:hover {
            color: #1d4ed8;
        }

        /* --- UPDATED: High Contrast Checkboxes --- */
        .markdown-body input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 1.1rem;
            height: 1.1rem;
            border: 2px solid #191919;
            border-radius: 4px;
            background-color: #ffffff;
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
            position: relative;
            cursor: pointer;
        }
        .markdown-body input[type="checkbox"]:checked {
            background-color: #16a34a;
            border-color: #15803d;
        }
        .markdown-body input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* --- UPDATED: GitHub Alerts (Note/Warning) & Custom Blockquotes --- */
        .markdown-body blockquote {
            border-left: 4px solid #cc6633;
            padding: 0.75rem 1rem;
            color: #4b5563;
            background-color: #f3f4f6;
            border-radius: 0 6px 6px 0;
            font-style: normal;
            margin-bottom: 1.5rem;
        }
        /* GitHub style [!NOTE] formatting target */
        .markdown-body blockquote.alert-note {
            border-left-color: #2563eb;
            background-color: #eff6ff;
            color: #1e3a8a;
        }
        /* GitHub style [!WARNING] formatting target */
        .markdown-body blockquote.alert-warning {
            border-left-color: #dc2626;
            background-color: #fef2f2;
            color: #7f1d1d;
        }
        /* Style title lines inside alerts */
        .alert-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Sticky Navigation Utility Bar -->
    <nav class="sticky top-0 bg-[#fbfaf7]/90 backdrop-blur-md border-b border-claude-border z-50">
        <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="font-mono text-xs text-claude-dark hover:text-claude-accent transition-colors flex items-center gap-1.5">
                ← Back to System Map
            </a>
            <span id="doc-meta-label" class="font-mono text-xs text-claude-muted">Loading specification file...</span>
        </div>
    </nav>

    <!-- Markdown Target Display Area -->
    <main class="max-w-3xl mx-auto px-6 mt-16">
        <article id="document-canvas" class="markdown-body">
            <!-- Dynamic Content Injected Here -->
            <p class="text-claude-muted font-mono text-sm">Assembling implementation documentation layers...</p>
        </article>
    </main>

    <script>
        async function runDynamicFetchEngine() {
            const canvas = document.getElementById('document-canvas');
            const metaLabel = document.getElementById('doc-meta-label');
            
            // Extract file target name from URL Search Parameters
            const urlParameters = new URLSearchParams(window.location.search);
            const targetsFileName = urlParameters.get('doc');
            
            if (!targetsFileName) {
                canvas.innerHTML = `<h1 class="text-xl">Error: No Target Specification Defined</h1><p>Please return to the main dashboard.</p>`;
                return;
            }
            
            metaLabel.innerText = `SRC: ./${targetsFileName}.md`;
            
            try {
                // Fetch raw markdown data cleanly across repo root space bounds
                const networkResponse = await fetch(`./\${targetsFileName}.md`);
                if (!networkResponse.ok) {
                    throw new Error(`HTTP network fault status returned: \${networkResponse.status}`);
                }
                const rawMarkdownText = await networkResponse.text();
                
                // Safely invoke compilation using the fully restored marked library engine
                if (window.marked && window.marked.parse) {
                    let htmlContent = window.marked.parse(rawMarkdownText);
                    
                    // Post-process the generated HTML to find and format GitHub Callout syntax
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlContent;
                    
                    const blockquotes = tempDiv.querySelectorAll('blockquote');
                    blockquotes.forEach(bq => {
                        let text = bq.innerHTML.trim();
                        
                        // Look for standard [!NOTE] identifier strings
                        if (text.includes('[!NOTE]')) {
                            bq.classList.add('alert-note');
                            bq.innerHTML = text.replace(/<p>\s*\[!NOTE\]\s*/i, '<p><span class="alert-title">ℹ️ Note</span>')
                                               .replace(/\[!NOTE\]\s*/i, '<span class="alert-title">ℹ️ Note</span>');
                        } 
                        // Look for standard [!WARNING] identifier strings
                        else if (text.includes('[!WARNING]') || text.includes('[!CAUTION]')) {
                            bq.classList.add('alert-warning');
                            bq.innerHTML = text.replace(/<p>\s*\[!(WARNING|CAUTION)\]\s*/i, '<p><span class="alert-title">⚠️ Warning</span>')
                                               .replace(/\[!(WARNING|CAUTION)\]\s*/i, '<span class="alert-title">⚠️ Warning</span>');
                        }
                    });
                    
                    canvas.innerHTML = tempDiv.innerHTML;
                } else {
                    throw new Error("Marked library is not initialized properly.");
                }
            } catch (runtimeFault) {
                console.error(runtimeFault);
                canvas.innerHTML = `
                    <h1 class="text-2xl font-normal text-claude-dark mb-4">Failed to Load Content Matrix</h1>
                    <p class="text-sm text-claude-muted mb-4">If you are inspecting this system locally in a browser directly via your file manager, cross-origin security configurations (CORS) will prevent resource gathering pipelines.</p>
                    <div class="bg-[#191919] p-4 text-white font-mono text-xs rounded mb-4">
                        Error Details: \${runtimeFault.message}
                    </div>
                    <pre class="bg-gray-100 p-4 rounded text-xs"><code>Local Server Required: Run 'python -m http.server 8000' inside root workspace directories to verify locally.</code></pre>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', runDynamicFetchEngine);
    </script>
</body>
</html>
